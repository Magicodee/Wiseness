<style>

      --hl: #5b5200; --hl-text: #fff3a0;
      --ok: #6fd39a; --ok-bg: #123022; --ok-line: #25583d;
      --bad: #ff8f86; --bad-bg: #3a1a18; --bad-line: #6e2f2b;
      --warn: #f0cf6a; --warn-bg: #3a2f10; --warn-line: #6b5a1c;
    }
  }
  :root[data-theme="dark"] {
    --bg: #10131a; --card: #181c25; --line: #323948; --line-strong: #6b7486;
    --text: #e6e9ef; --muted: #9aa3b2; --ink: #a9bbff; --head: #212c3d; --accent: #5aa0ff; --on-accent: #06122e;
    --hl: #5b5200; --hl-text: #fff3a0;

  }
  html { scroll-padding-top: env(safe-area-inset-top, 0px); }
  *, *::before, *::after { box-sizing: border-box; }

  /* ---------- الترويسة ---------- */

  .chip { text-align: end; font-size: .85rem; line-height: 1.35; flex: none; }

  :root[data-theme="dark"] .brand-name { color: var(--text); }
  @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .brand-name { color: var(--text); } :root:not([data-theme="light"]) h1.page { color: var(--text); } :root:not([data-theme="light"]) .hero h1.page { color: #fff; } }
  :root[data-theme="dark"] h1.page { color: var(--text); }
  :root[data-theme="dark"] .hero h1.page { color: #fff; }
  .hero { position: relative; overflow: hidden; border-radius: 14px; padding: 22px 28px 26px; margin-bottom: 20px; color: #fff; background: linear-gradient(120deg, #0aa2f5 0%, #3bb7fd 100%); }

  .hero .lead { color: #eaf6ff; margin: 0; position: relative; }
  .hero .doodle { position: absolute; inset-block: 0; inset-inline-end: 12px; height: 100%; width: 260px; opacity: .45; pointer-events: none; }
  .tiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 12px; margin: 8px 0 22px; }
  .tile { position: relative; margin-top: 28px; padding: 36px 12px 14px; border-radius: 10px; color: #fff; text-align: center; background: var(--c); }
  .tile .t-ic { position: absolute; top: -28px; left: 50%; transform: translateX(-50%); width: 56px; height: 56px; border-radius: 50%; background: #fff; color: var(--c); display: grid; place-items: center; box-shadow: 0 3px 10px rgba(0,0,0,.18); }
  .tile b { display: block; font-size: 1.9rem; line-height: 1.1; font-weight: 800; font-variant-numeric: tabular-nums; }
  .tile span { font-size: .9rem; font-weight: 600; opacity: .95; }
  .t-blue { --c: #0a6bfa; } .t-green { --c: #08a220; } .t-purple { --c: #5f038c; } .t-red { --c: #e3080b; }
  main { max-width: 1500px; margin: 0 auto; padding: 18px 20px 48px; }
  h1.page { margin: 0 0 4px; font-family: var(--display); font-size: 1.55rem; font-weight: 800; color: var(--navy); }
  h1.page small { font-family: var(--font); font-size: .95rem; font-weight: 500; color: var(--muted); margin-inline-start: 8px; }
  .lead { color: var(--muted); margin: 0 0 16px; }
  .head-row { display: flex; align-items: flex-end; gap: 12px; flex-wrap: wrap; margin-bottom: 8px; }
  .head-row .grow { flex: 1; min-width: 0; }
  .acts { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }

  /* ---------- عناصر عامة ---------- */
  .btn { display: inline-block; font: inherit; font-size: .92rem; cursor: pointer; text-align: center; background: var(--card); color: var(--text); border: 1px solid var(--line-strong); border-radius: 6px; padding: 7px 14px; }
  .btn:hover { background: var(--head); }
  .btn.primary { background: var(--accent); color: var(--on-accent); border-color: var(--accent); }
  .btn.primary:hover { filter: brightness(1.12); }
  .btn.small { padding: 4px 10px; font-size: .84rem; }
  .btn.danger { color: var(--bad); border-color: var(--bad); }
  .ml8 { margin-inline-start: 8px; }
  .btn[disabled] { opacity: .5; cursor: not-allowed; }
  input[type=text], input[type=number], select, textarea, input[type=file], input:not([type]) {
    font: inherit; background: var(--card); color: var(--text); border: 1px solid var(--line-strong); border-radius: 6px; padding: 7px 10px; min-width: 0;
  }
  textarea { width: 100%; min-height: 110px; resize: vertical; }
  label.f { display: flex; flex-direction: column; gap: 4px; font-size: .85rem; color: var(--muted); }
  .pill { display: inline-block; padding: 1px 10px; border-radius: 99px; font-size: .8rem; font-weight: 600; border: 1px solid; white-space: nowrap; }
  .pill.locked { background: var(--ok-bg); color: var(--ok); border-color: var(--ok-line); }
  .pill.open { background: var(--warn-bg); color: var(--warn); border-color: var(--warn-line); }
  .pill.idle { background: var(--head); color: var(--muted); border-color: var(--line); }

  .card h2 { margin: 0 0 10px; font-size: 1.05rem; }
  .form-row { display: flex; gap: 12px; align-items: flex-end; flex-wrap: wrap; }
  .strip { display: flex; margin-bottom: 16px; background: var(--card); border: 1px solid var(--line); border-radius: 8px; width: max-content; max-width: 100%; }

  .strip > div:first-child { border-inline-start: 0; }
  .strip b { font-size: 1.5rem; line-height: 1.2; font-variant-numeric: tabular-nums; }
  .strip span { font-size: .82rem; color: var(--muted); }
  .filter { display: flex; gap: 10px; align-items: center; margin-bottom: 14px; flex-wrap: wrap; font-size: .9rem; color: var(--muted); }
  .table-wrap { background: var(--card); border: 1px solid var(--line); border-radius: 8px; overflow-x: auto; }
  table.tbl { width: 100%; border-collapse: collapse; }
  .tbl th { text-align: right; font-size: .82rem; color: var(--muted); font-weight: 600; padding: 10px 14px; background: var(--head); border-bottom: 1px solid var(--line); white-space: nowrap; }
  .tbl td { padding: 9px 14px; border-bottom: 1px solid var(--line); vertical-align: middle; }
  .tbl tbody tr:last-child td { border-bottom: 0; }
  .tbl tr.arch td { color: var(--muted); }
  .row-actions { display: flex; gap: 6px; align-items: center; justify-content: flex-end; flex-wrap: wrap; }
  .prog { white-space: nowrap; }
  .prog span { margin-inline-start: 8px; font-size: .88rem; color: var(--muted); font-variant-numeric: tabular-nums; }
  progress { appearance: none; -webkit-appearance: none; width: 120px; height: 8px; border: 0; border-radius: 99px; background: var(--line); vertical-align: middle; overflow: hidden; }
  progress::-webkit-progress-bar { background: var(--line); border-radius: 99px; }
  progress::-webkit-progress-value { background: linear-gradient(90deg, var(--blue), var(--sky)); border-radius: 99px; }
  progress::-moz-progress-bar { background: var(--blue); border-radius: 99px; }
  .chips { list-style: none; display: flex; flex-wrap: wrap; gap: 8px; padding: 0; margin: 0; }
  .chips li { background: var(--card); border: 1px solid var(--line); border-radius: 6px; padding: 6px 14px; }
  .note { margin-top: 12px; font-size: .84rem; color: var(--muted); max-width: 75ch; }
  .hits { list-style: none; margin: 8px 0 0; padding: 0; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; }
  .hits li { display: flex; align-items: center; gap: 10px; padding: 8px 12px; border-bottom: 1px solid var(--line); background: var(--card); }
  .hits li:last-child { border-bottom: 0; }
  .hits img, .av { width: 28px; height: 28px; border-radius: 50%; flex: none; }
  .hits .nm { flex: 1; }

  /* ---------- كشف الدرجات ---------- */
  .sheet-meta { display: flex; flex-wrap: wrap; gap: 8px 20px; align-items: center; margin-bottom: 8px; color: var(--muted); font-size: .92rem; }
  .sheet-meta b { color: var(--text); }
  .legend { margin-inline-start: auto; display: flex; gap: 8px; align-items: center; font-size: .84rem; }
  .sw { display: inline-block; width: 14px; height: 14px; border: 1px solid var(--line-strong); border-radius: 3px; background: var(--card); margin-inline-start: 10px; }
  .sw.hl { background: var(--hl); }
  .status { min-height: 1.6em; font-size: .9rem; color: var(--muted); margin-bottom: 4px; }
  .status.err { color: var(--bad); font-weight: 600; }
  .wrap { overflow: auto; max-height: calc(100vh - 290px); min-height: 260px; background: var(--card); border: 1px solid var(--line-strong); border-radius: 8px; }
  #grid { border-collapse: separate; border-spacing: 0; width: max-content; min-width: 100%; }
  #grid th, #grid td { border-bottom: 1px solid var(--line); border-left: 1px solid var(--line); padding: 0; text-align: center; }
  #grid th { background: var(--head); font-weight: 600; font-size: .8rem; padding: 4px 6px; position: sticky; z-index: 2; }

  #grid th.gs, #grid td.gs { border-left: 2px solid var(--line-strong); }
  #grid th.calc { background: var(--hl); color: var(--hl-text); }
  #grid th.calc small { color: var(--hl-text); opacity: .75; }
  #grid td.stu { position: sticky; right: 0; z-index: 1; background: var(--card); text-align: right; padding: 0 12px; white-space: nowrap; font-size: .93rem; border-left: 2px solid var(--line-strong); }
  #grid td.stu .n { display: inline-block; width: 1.9em; color: var(--muted); font-size: .8rem; }
  #grid td.calc { background: var(--hl); color: var(--hl-text); font-weight: 700; font-variant-numeric: tabular-nums; min-width: 60px; padding: 0 6px; }
  #grid td.calc.empty { opacity: .55; font-weight: 400; }
  #grid tbody tr:last-child td { border-bottom: 0; }
  #grid input.c { width: 100%; min-width: 54px; height: 42px; border: 0; background: transparent; text-align: center; color: var(--ink); font: inherit; font-weight: 600; font-size: 1rem; font-variant-numeric: tabular-nums; padding: 0 2px; border-radius: 0; }
  #grid input.c:focus { background: var(--head); outline: 2px solid var(--ink); outline-offset: -2px; }
  #grid input.c.bad { background: var(--bad-bg); color: var(--bad); }
  #grid input.c[readonly] { color: var(--text); cursor: default; }
  .readonly #grid input.c { background: color-mix(in srgb, var(--head) 40%, transparent); }
  .stats { display: flex; flex-wrap: wrap; gap: 6px 24px; margin-top: 12px; font-size: .9rem; color: var(--muted); }
  .stats b { color: var(--text); font-variant-numeric: tabular-nums; }
  .savestate { font-size: .84rem; color: var(--muted); min-width: 7.5em; text-align: end; }
  .savestate.ok { color: var(--ok); } .savestate.err { color: var(--bad); font-weight: 600; }

  /* ---------- نوافذ ورسائل ---------- */
  #modal { position: fixed; inset: 0; z-index: 100; display: none; align-items: center; justify-content: center; background: rgba(13,26,51,.55); padding: 20px; }
  #modal.show { display: flex; }
  .dlg { background: var(--card); color: var(--text); border-radius: 10px; padding: 20px; max-width: 420px; width: 100%; border-top: 4px solid var(--blue); }
  .dlg p { margin: 0 0 16px; white-space: pre-line; }
  .dlg-actions { display: flex; gap: 8px; justify-content: flex-start; }
  #toast { position: fixed; inset-inline: 0; bottom: calc(18px + env(safe-area-inset-bottom, 0px)); display: flex; justify-content: center; z-index: 90; pointer-events: none; }
  #toast div { background: var(--navy); color: #fff; padding: 9px 18px; border-radius: 99px; font-size: .92rem; box-shadow: 0 6px 20px rgba(0,0,0,.3); }
  #toast div.err { background: var(--bad); }

  .setup { max-width: 560px; margin: 40px auto; text-align: center; }
  .setup svg { margin-bottom: 12px; }
  .setup h1 { font-family: var(--display); margin: 0 0 8px; }
  .setup .card { text-align: right; }
  .scheme-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 12px; }
  .rowline { display: flex; gap: 8px; align-items: center; margin-bottom: 6px; }
  .rowline input[type=text] { flex: 1; }
  .rowline input[type=number] { width: 90px; }

  @media (max-width: 760px) {
    main { padding-inline: 12px; }
    .top { padding-inline: 12px; flex-wrap: wrap; } .brand-name { font-size: 1rem; } .brand img { width: 48px; height: 48px; }
    .tabs { order: 3; flex-basis: 100%; } .chip { margin-inline-start: auto; }
    .strip-top { padding-inline: 12px; font-size: .78rem; } .hero { padding: 16px 16px 20px; } .hero .doodle { opacity: .25; }
    table.cards, table.cards tbody, table.cards tr { display: block; }
    table.cards thead { display: none; }
    table.cards tr { display: grid; grid-template-columns: 1fr auto; gap: 4px 10px; padding: 12px 14px; border-bottom: 1px solid var(--line); }
    table.cards tr:last-child { border-bottom: 0; }
    table.cards td { border: 0; padding: 0; }
    table.cards .c-class { grid-column: 1; grid-row: 1; font-weight: 700; }
    table.cards .c-status { grid-column: 2; grid-row: 1; justify-self: end; }
    table.cards .c-subject { grid-column: 1 / -1; font-size: 1.05rem; font-weight: 600; }
    table.cards .c-teacher { grid-column: 1 / -1; color: var(--muted); font-size: .9rem; }
    table.cards .c-prog { grid-column: 1 / -1; display: flex; align-items: center; margin: 4px 0; }
    table.cards .c-prog progress { flex: 1; width: auto; }
    table.cards .c-actions { grid-column: 1 / -1; justify-content: flex-start; margin-top: 4px; }
    .wrap { max-height: calc(100vh - 260px); }
    .legend { margin-inline-start: 0; }
  }
  @media print { .strip-top, .top, .tabs, .acts, #toast { display: none !important; } .wrap { max-height: none; overflow: visible; } }
</style>

<script>
(function () {
'use strict';

/* =====================================================================
   أدوات عامة
   ===================================================================== */
const $ = (s, el) => (el || document).querySelector(s);
function h(tag, attrs, ...kids) {
  const e = document.createElement(tag);
  let value;
  for (const k in (attrs || {})) {
    const v = attrs[k];
    if (v == null || v === false) continue;
    if (k === 'class') e.className = v;
    else if (k === 'text') e.textContent = v;
    else if (k === 'value') value = v;
    else if (k.slice(0, 2) === 'on') e.addEventListener(k.slice(2), v);
    else e.setAttribute(k, v === true ? '' : v);
  }
  for (const kid of kids.flat(Infinity)) {
    if (kid == null || kid === false) continue;
    e.append(kid.nodeType ? kid : document.createTextNode(String(kid)));
  }
  if (value !== undefined) e.value = value;
  return e;
}
const sleep = ms => new Promise(r => setTimeout(r, ms));
function rid(prefix) { return prefix + Math.random().toString(36).slice(2, 8) + Date.now().toString(36).slice(-3); }
function toast(msg, isErr) {
  const t = $('#toast'); const d = h('div', { class: isErr ? 'err' : '', text: msg });
  t.append(d); setTimeout(() => d.remove(), isErr ? 5000 : 2600);
}
function confirmBox(msg, okText) {
  return new Promise(res => {
    const m = $('#modal'); m.innerHTML = '';
    const done = v => { m.classList.remove('show'); m.innerHTML = ''; res(v); };
    m.append(h('div', { class: 'dlg', role: 'dialog', 'aria-modal': 'true' },
      h('p', { text: msg }),
      h('div', { class: 'dlg-actions' },
        h('button', { class: 'btn primary', type: 'button', onclick: () => done(true), text: okText || 'تأكيد' }),
        h('button', { class: 'btn', type: 'button', onclick: () => done(false), text: 'إلغاء' }))));
    m.classList.add('show');
    m.querySelector('.btn.primary').focus();
  });
}
function isoWeek(d) {
  d = d || new Date();
  const t = new Date(Date.UTC(d.getFullYear(), d.getMonth(), d.getDate()));
  t.setUTCDate(t.getUTCDate() + 4 - (t.getUTCDay() || 7));
  const y = t.getUTCFullYear();
  const w = Math.ceil(((t - Date.UTC(y, 0, 1)) / 86400000 + 1) / 7);
  return y + '-W' + String(w).padStart(2, '0');
}
function normalizeNum(s) {
  return String(s == null ? '' : s)
    .replace(/[٠-٩]/g, d => '٠١٢٣٤٥٦٧٨٩'.indexOf(d))
    .replace(/[۰-۹]/g, d => '۰۱۲۳۴۵۶۷۸۹'.indexOf(d))
    .replace(/[٫,،]/g, '.').trim();
}
function parseGrade(raw, max) {
  const s = normalizeNum(raw);
  if (s === '') return { empty: true };
  const n = Number(s);
  if (!isFinite(n) || n < 0 || n > max) return { bad: true };
  return { v: Math.round(n * 100) / 100 };
}

/* =====================================================================
   هيكل الدرجات والحسابات (نفس منطق النسخة الأولى المختبرة)
   ===================================================================== */
const DEFAULT_SCHEME = {
  months: [{ key: 'feb', name: 'فبراير' }, { key: 'mar', name: 'مارس' }, { key: 'apr', name: 'أبريل' }],
  weeks: 4, weekMax: 15,
  parts: [{ key: 'notebook', name: 'كراسة', max: 10 }, { key: 'homework', name: 'واجب ومواظبة', max: 10 }, { key: 'behavior', name: 'سلوك', max: 5 }],
  exams: [{ key: 'mar', name: 'اختبار مارس', max: 15 }, { key: 'apr', name: 'اختبار أبريل', max: 15 }]
};
const sum = a => a.reduce((x, y) => x + y, 0);
const r1 = x => Math.floor(x * 10 + 0.5) / 10;
const fmt = x => (x == null ? '—' : String(r1(x)));
const fmtBlank = x => (x == null ? '' : String(r1(x)));
const monthMax = s => s.weekMax + sum(s.parts.map(p => p.max));
const sumMax = s => monthMax(s) * s.months.length;
const avgMax = s => monthMax(s);
const finalMax = s => avgMax(s) + sum(s.exams.map(e => e.max));
function schemeFields(s) {
  const out = [];
  s.months.forEach(m => {
    for (let w = 1; w <= s.weeks; w++) out.push({ key: m.key + '_w' + w, max: s.weekMax, label: m.name + ' – أسبوع ' + w });
    s.parts.forEach(p => out.push({ key: m.key + '_' + p.key, max: p.max, label: m.name + ' – ' + p.name }));
  });
  s.exams.forEach(e => out.push({ key: 'x_' + e.key, max: e.max, label: e.name }));
  return out;
}
function compute(s, vals) {            // vals: key -> number|null|undefined
  const g = k => (typeof vals[k] === 'number' ? vals[k] : null);
  const months = s.months.map(m => {
    const weeks = [];
    for (let w = 1; w <= s.weeks; w++) { const v = g(m.key + '_w' + w); if (v !== null) weeks.push(v); }
    const avg = weeks.length ? sum(weeks) / weeks.length : null;
    const parts = s.parts.map(p => g(m.key + '_' + p.key));
    const any = avg !== null || parts.some(v => v !== null);
    const total = any ? (avg || 0) + sum(parts.map(v => v || 0)) : null;
    return { avg, total };
  });
  const totals = months.map(m => m.total).filter(t => t !== null);
  const tsum = totals.length ? sum(totals) : null;
  const avg = tsum === null ? null : tsum / s.months.length;
  const exams = s.exams.map(e => g('x_' + e.key));
  const anyF = avg !== null || exams.some(v => v !== null);
  const fin = anyF ? (avg || 0) + sum(exams.map(v => v || 0)) : null;
  return { months, sum: tsum, avg, final: fin };
}

/* =====================================================================
   الحالة العامة
   ===================================================================== */
const S = {
  cfg: null, subjects: [], classes: {}, assign: {}, status: {}, staff: {}, locks: {},
  me: null, isOwner: false, isEditor: false, names: {}, loaded: {}, fatal: null, revoked: false
};
let db = null, userCap = null, dlCap = null;
let route = { name: 'dashboard' };

const DEFAULT_SCHOOL = 'مدرسة ويزنس للغات';
const OLD_PLACEHOLDER = 'مدرسة الأفق النموذجية للغات';
const schoolName = () => (!S.cfg || !S.cfg.school || S.cfg.school === OLD_PLACEHOLDER) ? DEFAULT_SCHOOL : S.cfg.school;
const scheme = () => (S.cfg && S.cfg.scheme) || DEFAULT_SCHEME;
function role() {
  if (S.parentMode) return 'parent';
  if (S.isOwner) return 'control';
  const r = S.me && S.me.id && S.staff[S.me.id] && S.staff[S.me.id].role;
  if (r) return r;
  return S.isEditor ? 'control' : null;
}
// الأدوار: control = «إدارة النظام-كنترول» (كل الصلاحيات)، admin = «مراقبة النظام» (عرض فقط)، teacher = معلم
const isStaff = () => role() === 'control';

/* =====================================================================
   الكتابة في قاعدة البيانات: طابور لكل وثيقة + دمج للدفعات
   ===================================================================== */
const Q = new Map();
let inflight = 0, failedWrites = 0;
function mergeDeep(a, b) {
  for (const k in b) {
    const v = b[k];
    if (v && typeof v === 'object' && !Array.isArray(v)) a[k] = mergeDeep(a[k] && typeof a[k] === 'object' && !Array.isArray(a[k]) ? a[k] : {}, v);
    else a[k] = v;
  }
  return a;
}
function setSaveState(kind, text) {
  const el = $('#saveState'); if (!el) return;
  el.textContent = text || ''; el.className = 'savestate ' + (kind || '');
}
function errText(e) {
  const c = e && e.code;
  if (c === 'invalid_argument') return 'ليس لديك صلاحية الكتابة هنا (راجع مستوى مشاركتك للصفحة).';
  if (c === 'permission-denied') return 'ليس لديك صلاحية لهذا الإجراء (قواعد الأمان). لو الكشف معتمد ومقفول تواصل مع الكنترول.';
  if (c === 'quota_exceeded') return 'امتلأت سعة قاعدة البيانات. تواصل مع إدارة النظام.';
  if (c === 'resource_exhausted' || c === 'resource-exhausted') return 'ضغط كبير على النظام، حاول بعد لحظات.';
  if (c === 'revoked') return 'تم سحب صلاحيتك على الصفحة.';
  return 'تعذّر الحفظ. تأكد من الاتصال بالإنترنت.';
}
function write(path, patch) {
  let q = Q.get(path);
  if (!q) { q = { pending: null, busy: false }; Q.set(path, q); }
  q.pending = mergeDeep(q.pending || {}, patch);
  setSaveState('', 'جارٍ الحفظ…');
  return pump(path, q);
}
async function pump(path, q) {
  if (q.busy || !q.pending) return;
  q.busy = true;
  const patch = q.pending; q.pending = null; inflight++;
  let ok = false, lastErr = null;
  for (let attempt = 0; attempt < 2 && !ok; attempt++) {
    try {
      const ref = db.doc(path);
      try { await ref.update(patch); }
      catch (e) { if (e && e.code === 'invalid_argument') await ref.set(patch); else throw e; }
      ok = true;
    } catch (e) {
      lastErr = e;
      if (e && (e.code === 'unavailable' || e.code === 'resource_exhausted' || e.code === 'resource-exhausted') && attempt === 0) await sleep(1200 + Math.random() * 1500);
      else break;
    }
  }
  inflight--; q.busy = false;
  if (!ok) {
    q.pending = mergeDeep(patch, q.pending || {});
    q.failed = true; failedWrites++;
    setSaveState('err', 'تعذّر الحفظ');
    const st = $('#status'); if (st) { st.textContent = errText(lastErr); st.classList.add('err'); }
    else toast(errText(lastErr), true);
    return;
  }
  if (q.failed) { q.failed = false; failedWrites = Math.max(0, failedWrites - 1); }
  if (q.pending) return pump(path, q);
  if (!inflight && !failedWrites) { setSaveState('ok', 'تم الحفظ'); const st = $('#status'); if (st && st.classList.contains('err') && !st.dataset.keep) { st.textContent = ''; st.classList.remove('err'); } }
}
function retryAll() { Q.forEach((q, path) => { if (q.failed && q.pending) pump(path, q); }); }
window.addEventListener('online', retryAll);
window.addEventListener('beforeunload', e => { if (inflight || failedWrites) { e.preventDefault(); e.returnValue = ''; } });

/* ---------- الحذف (للكنترول والإدارة فقط) مع سلة محذوفات ---------- */
const TRASH_MAX = 200000;
async function docOps(paths) {
  const out = [];
  for (const p of paths) { try { const s = await db.doc(p).get(); if (s.exists) out.push({ op: 'doc', p, d: s.data() }); } catch (e) { /* تجاهل */ } }
  return out;
}
const statusMerge = (cid, sid) => { const e = ((S.status[cid] || {}).m || {})[sid]; return e ? [{ op: 'merge', p: 'status/' + cid, d: { m: { [sid]: e } } }] : []; };
const assignMerge = (cid, sid) => { const t = ((S.assign[cid] || {}).m || {})[sid]; return t ? [{ op: 'merge', p: 'assignments/' + cid, d: { m: { [sid]: t } } }] : []; };
async function trashAndConfirm(msg, okText, type, label, ops) {
  const body = { type, label, ts: Date.now(), by: S.me.id, ops };
  const fits = JSON.stringify(body).length <= TRASH_MAX;
  const tail = fits ? '\nهتتنقل لسلة المحذوفات وتقدر ترجّعها منها.' : '\nحجمه كبير على السلة، فالحذف هنا نهائي ومينفعش يترجّع.';
  if (!(await confirmBox(msg + tail, okText))) return false;
  if (fits) {
    try { await db.doc('trash/' + rid('t')).set(body); }
    catch (e) { toast('تعذّر نقله للسلة، اتلغى الحذف. ' + errText(e), true); return false; }
  }

}

async function deleteStudent(cid, stId) {

async function deleteSubject(sid) {
  if (!isStaff()) return;
  const sj = S.subjects.find(s => s.id === sid); if (!sj) return;
  const ops = [{ op: 'subject', item: sj }]; const todo = [];
  for (const cid of Object.keys(S.classes)) {

    ops.push(...(await docOps([p, 'locks/' + cid + '__' + sid])), ...statusMerge(cid, sid), ...assignMerge(cid, sid));
  }

    await del(t.p); await del('locks/' + t.cid + '__' + sid);
    if (t.hasSt) await write('status/' + t.cid, { m: { [sid]: null } });
    if (t.hasAs) await write('assignments/' + t.cid, { m: { [sid]: null } });

async function restoreTrash(t) {
  let skipped = 0;
  for (const op of t.ops || []) {
    try {
      if (op.op === 'doc') await db.doc(op.p).set(op.d);
      else if (op.op === 'merge') await write(op.p, op.d);
      else if (op.op === 'student') {
        const c = S.classes[op.cid];
        if (!c) { skipped++; continue; }
        if (!(c.students || []).some(x => x.id === op.st.id)) await write('classes/' + op.cid, { students: (c.students || []).concat([op.st]) });
      } else if (op.op === 'subject') {
        if (!S.subjects.some(x => x.id === op.item.id)) await write('config/subjects', { list: S.subjects.concat([op.item]) });
      }
    } catch (e) { skipped++; }
  }
  await del('trash/' + t.id);
  logAudit({ x: 'del', n: 'استرجاع ' + t.label });
  toast(skipped ? 'تم الاسترجاع مع تخطي ' + skipped + ' عنصر.' : 'تم الاسترجاع.');
}

  db.doc('config/main').onSnapshot(s => { S.cfg = s.exists ? s.data() : null; markLoaded('cfg'); }, subErr);
  db.doc('config/subjects').onSnapshot(s => { S.subjects = s.exists ? (s.data().list || []) : []; markLoaded('subjects'); }, subErr);
  db.collection('classes').onSnapshot(q => { const o = {}; q.docs.forEach(d => { o[d.id] = d.data(); }); S.classes = o; markLoaded('classes'); }, subErr);
  db.collection('assignments').onSnapshot(q => { const o = {}; q.docs.forEach(d => { o[d.id] = d.data(); }); S.assign = o; markLoaded('assign'); }, subErr);

  db.collection('status').onSnapshot(q => { const o = {}; q.docs.forEach(d => { o[d.id] = d.data(); }); S.status = o; markLoaded('status'); }, subErr);
  db.collection('staff').onSnapshot(q => { const o = {}; q.docs.forEach(d => { o[d.id] = d.data(); }); S.staff = o; markLoaded('staff'); }, subErr);
}

        h('button', { class: 'btn small', type: 'button', text: 'تصدير Excel', onclick: () => exportAssignment(cid, sid) }),
        isStaff() && h('button', { class: 'btn small danger', type: 'button', text: 'تفريغ الدرجات', onclick: () => clearSheet(cid, sid) }), btnLock, btnUnlock)),
    metaEl, statusEl, wrapEl, statsEl,
    h('p', { class: 'note', text: 'Enter أو السهم لأسفل للنزول للطالب التالي في نفس العمود. الحفظ تلقائي بعد كل خانة، وتشوف تعديلات زمايلك لحظيًا. الدرجة اللي تعدّي الحد الأقصى بتتلوّن أحمر ولا تتحفظ.' }));

  const numVal = (id, key) => { const p = parseGrade(local[id][key], FM[key]); return p.v === undefined ? null : p.v; };
  function rowVals(id) { const o = {}; keys.forEach(f => { o[f.key] = numVal(id, f.key); }); return o; }

  /* ---------- الرسم ---------- */

  function inputCell(st, key, label) {
    const raw = local[st.id][key] == null ? '' : local[st.id][key];

  function build() {

async function readNamesFile(f) {
  const nm = f.name.toLowerCase();

    const text = (await f.text()).replace(/^\uFEFF/, '');

  }
  if (nm.endsWith('.xlsx')) {
    await loadExcelJS();
    const wb = new window.ExcelJS.Workbook(); await wb.xlsx.load(await f.arrayBuffer());
    const out = [];
    wb.worksheets[0].eachRow(row => {
      const cell = (row.values || []).slice(1).map(v => (v && v.richText ? v.richText.map(t => t.text).join('') : v)).find(v => v != null && String(v).trim() && isNaN(Number(v)));
      if (cell != null) out.push(String(cell).trim());
    });
    return out.filter(n => !HEADERS.has(n));
  }
  throw new Error('الملف لازم يكون Excel (.xlsx) أو CSV.');
}

const colIdx = (head, names) => head.findIndex(x => names.includes(x));
function cellText(v) {
  if (v == null) return '';
  if (typeof v === 'object') {
    if (v.richText) return v.richText.map(t => t.text).join('').trim();
    if (v.text != null) return String(v.text).trim();
    if (v.result != null) return String(v.result).trim();
    return '';
  }
  return String(v).trim();

function parseCSV(text) {
  const rows = []; let row = [], cur = '', q = false;
  text = text.replace(/^\uFEFF/, '');
  for (let i = 0; i < text.length; i++) {
    const c = text[i];
    if (q) { if (c === '"') { if (text[i + 1] === '"') { cur += '"'; i++; } else q = false; } else cur += c; }
    else if (c === '"') q = true;
    else if (c === ',' || c === '\t') { row.push(cur); cur = ''; }
    else if (c === '\n') { row.push(cur); rows.push(row); row = []; cur = ''; }
    else if (c !== '\r') cur += c;
  }
  if (cur || row.length) { row.push(cur); rows.push(row); }
  return rows.map(r => r.map(x => x.trim()));
}
async function readSheets(f) {
  const nm = f.name.toLowerCase();

  if (nm.endsWith('.xlsx')) {
    await loadExcelJS();
    const wb = new window.ExcelJS.Workbook(); await wb.xlsx.load(await f.arrayBuffer());
    return wb.worksheets.map(ws => {

      ws.eachRow({ includeEmpty: false }, row => { rows.push(Array.from((row.values || []).slice(1), cellText)); });

}

function buildImportPlan(sheets) {
  const stu = [], asg = [], warnings = [];
  sheets.forEach(rows => {
    if (!rows.length) return;
    const head = rows[0].map(x => String(x).trim().toLowerCase());
    const ci = colIdx(head, COLS.cls), ui = colIdx(head, COLS.stu), si = colIdx(head, COLS.sub), ti = colIdx(head, COLS.tch);
    if (ci < 0) return;
    rows.slice(1).forEach(r => {
      const c = (r[ci] || '').trim(); if (!c) return;
      if (ui >= 0 && r[ui]) { const n = cleanName(r[ui]).slice(0, 120); if (n) stu.push({ cls: c, name: n }); }
      if (si >= 0 && ti >= 0 && r[si] && r[ti]) asg.push({ cls: c, sub: r[si].trim(), tch: r[ti].trim() });
    });
  });
  const classes = new Map();                       // اسم الفصل -> { id, name, isNew, add: [] }
  const getClass = name => {
    if (!classes.has(name)) {
      const ex = classesSorted().find(c => c.name === name);
      classes.set(name, { id: ex ? ex.id : rid('c'), name, isNew: !ex, add: [] });
    }
    return classes.get(name);
  };
  let dupes = 0;
  stu.forEach(s => {
    const c = getClass(s.cls);
    const have = new Set(((S.classes[c.id] || {}).students || []).map(x => x.name));
    if (have.has(s.name) || c.add.includes(s.name)) { dupes++; return; }
    c.add.push(s.name);
  });
  const subjByName = new Map(S.subjects.map(s => [s.name, s.id]));
  const newSubjects = [];
  const asgOut = [], missing = new Set();
  asg.forEach(a => {
    const tid = findTeacher(a.tch);
    if (!tid) { missing.add(a.tch); return; }
    const c = getClass(a.cls);
    if (!subjByName.has(a.sub)) { const id = rid('m'); subjByName.set(a.sub, id); newSubjects.push({ id, name: a.sub }); }
    asgOut.push({ cid: c.id, cname: c.name, sid: subjByName.get(a.sub), sname: a.sub, tid });
  });
  if (missing.size) warnings.push('معلمين مش موجودين في «المستخدمون» (اتخطّى تكليفهم): ' + Array.from(missing).join('، '));
  if (dupes) warnings.push('طلاب مكررين أو موجودين قبل كده (اتخطّوا): ' + dupes);
  if (!stu.length && !asg.length) warnings.push('مالقيتش أعمدة مناسبة. لازم يكون فيه عمود «الفصل» مع «اسم الطالب» أو مع «المادة» و«المعلم».');
  return { classes, newSubjects, asg: asgOut, warnings };
}

function buildParentPlan(sheets, existing) {
  const idx = new Map(), warnings = [], seen = new Set(), items = [], linked = linkedKids(existing);
  Object.keys(S.classes).forEach(cid => (S.classes[cid].students || []).forEach(st => {
    const k = normAr(S.classes[cid].name) + '|' + normAr(st.name);
    if (!idx.has(k)) idx.set(k, []);
    idx.get(k).push({ cid, st });
  }));
  let rowsN = 0, already = 0, dup = 0;
  const notFound = [], ambiguous = [];
  sheets.forEach(rows => {
    if (!rows.length) return;
    const head = rows[0].map(x => String(x).trim().toLowerCase());
    const ci = colIdx(head, PCOLS.cls), ui = colIdx(head, PCOLS.stu), pi = colIdx(head, PCOLS.par), mi = colIdx(head, PCOLS.mob);
    if (ci < 0 || ui < 0) return;
    rows.slice(1).forEach(r => {
      const cn = (r[ci] || '').trim(), sn = cleanName(r[ui] || ''); if (!cn || !sn) return;
      rowsN++;
      const hit = idx.get(normAr(cn) + '|' + normAr(sn));
      if (!hit) { notFound.push(cn + ' – ' + sn); return; }
      if (hit.length > 1) { ambiguous.push(cn + ' – ' + sn); return; }
      const kid = hit[0].cid + '__' + hit[0].st.id;
      if (linked.has(kid)) { already++; return; }
      if (seen.has(kid)) { dup++; return; }
      seen.add(kid);
      let mob = mi >= 0 ? normalizeNum(r[mi] || '').replace(/\D/g, '') : '';
      mob = mob.length >= 10 ? mob.slice(-10) : '';
      const pname = pi >= 0 ? cleanName(r[pi] || '').slice(0, 120) : '';
      items.push({ kid, cid: hit[0].cid, stId: hit[0].st.id, sname: hit[0].st.name, cname: className(hit[0].cid), pname, mob });
    });
  });
  if (!rowsN) warnings.push('مالقيتش أعمدة «الفصل» و«اسم الطالب». راجع عناوين الأعمدة.');
  if (notFound.length) warnings.push('طلاب مش لاقيهم في الفصول (اتخطّوا): ' + notFound.length + ' – مثال: ' + notFound.slice(0, 5).join('، '));
  if (ambiguous.length) warnings.push('أسماء مكررة في نفس الفصل ومينفعش نحدد أنهي طالب (اتخطّوا): ' + ambiguous.slice(0, 5).join('، '));
  if (already) warnings.push('طلاب عندهم حسابات قبل كده (اتخطّوا): ' + already);
  if (dup) warnings.push('طلاب مذكورين أكتر من مرة في الملف (اتاخد أول سطر): ' + dup);
  return { items, warnings };
}
function buildAllPlan(existing) {                              // كل طالب من غير حساب، من غير ملف
  const linked = linkedKids(existing), items = []; let already = 0;
  Object.keys(S.classes).forEach(cid => students(cid).forEach(st => {
    const kid = cid + '__' + st.id;
    if (linked.has(kid)) { already++; return; }
    items.push({ kid, cid, stId: st.id, sname: st.name, cname: className(cid), pname: '', mob: '' });
  }));
  return { items, warnings: already ? ['طلاب عندهم حسابات قبل كده (اتخطّوا): ' + already] : [] };
}

// بيعمل حسابين: الطالب (كود) وولي الأمر (p-كود) بنفس كلمة المرور، ويحفظ البيانات للإدارة في creds
async function createPair(k, pname, mob) {
  const pw = newParentPw(); let code = '', sUid = null, pUid = null;
  try {
    for (let t = 0; t < 4 && !sUid; t++) {
      code = newKidCode();
      try { sUid = await createParentAuth(studentLogin(code), pw); }
      catch (e) { if (e && e.code === 'auth/email-already-in-use') continue; throw e; }
    }
    if (!sUid) throw new Error('تعذّر توليد كود');
    pUid = await createParentAuth(parentLogin(code), pw);
    const t = Date.now(), info = kidsInfo([k]), pn = pname || ('ولي أمر ' + k.sname);
    const sDoc = { name: k.sname, kids: [k.kid], info, login: code, type: 's', t };
    const pDoc = { name: pn, kids: [k.kid], info, login: 'p-' + code, type: 'p', t };
    if (mob) pDoc.mob = mob;
    if (!(await writeVerified('parents/' + sUid, sDoc)) || !(await writeVerified('parents/' + pUid, pDoc))) throw new Error('تعذّر الحفظ');
    const base = { kid: k.kid, sname: k.sname, cname: k.cname, pname: pn, pw, t };
    await writeVerified('creds/' + sUid, Object.assign({ login: code, type: 's' }, base));
    await writeVerified('creds/' + pUid, Object.assign({ login: 'p-' + code, type: 'p' }, base));
    return { sname: k.sname, cname: k.cname, pname: pn, scode: code, pcode: 'p-' + code, pw };
  } catch (e) {
    for (const u of [sUid, pUid]) { if (u) { try { await del('parents/' + u); await del('creds/' + u); } catch (x) { /* تجاهل */ } } }
    if (sUid) await deleteAuthUser(studentLogin(code), pw);
    if (pUid) await deleteAuthUser(parentLogin(code), pw);
    throw e;
  }
}
async function runParentPlan(P, onProgress) {
  const res = { cards: [], made: 0, failed: [], stopped: false };
  try { await db.doc('creds/_probe').set({ t: Date.now() }); await db.doc('creds/_probe').delete(); }
  catch (e) { res.failed.push({ name: 'قواعد Firestore', why: 'مقدرتش أكتب في creds فمفيش حسابات اتعملت. انشر القاعدة: match /creds/{u} { allow read, write: if isStaff(); } وحدّث الصفحة.' }); return res; }
  let n = 0;
  for (const k of P.items) {
    n++; onProgress(n, P.items.length);
    try { res.cards.push(await createPair(k, k.pname, k.mob)); res.made++; }
    catch (e) {
      const c = e && e.code;
      res.failed.push({ name: k.sname + ' – ' + k.cname, why: c && c.startsWith('auth/') ? authErr(e) : (e.message || 'خطأ') });
      if (c === 'auth/too-many-requests' || c === 'auth/quota-exceeded') { res.stopped = true; res.stoppedAt = { sname: k.sname, cname: k.cname, done: res.made, total: P.items.length, when: new Date().toLocaleString('ar-EG') }; break; }
    }
    await sleep(350);
  }
  logAudit({ x: 'staff', n: 'إنشاء حسابات طلاب وأولياء أمور: ' + res.made + ' طالب' + (res.stoppedAt ? ' – توقف عند: ' + res.stoppedAt.sname + ' (' + res.stoppedAt.cname + ')' : '') });
  try { if (res.stoppedAt) localStorage.setItem('wls_stop', JSON.stringify(res.stoppedAt)); else if (!res.failed.length) localStorage.removeItem('wls_stop'); } catch (e) { /* تجاهل */ }
  return res;
}
async function downloadCards(cards) {

// بيمسح مستخدم الدخول نفسه من Firebase Authentication: بيدخل بيه (إحنا عارفين كلمة المرور) ويمسحه
async function deleteAuthUser(email, pw) {
  const sec = FB.appM.initializeApp(FIREBASE_CONFIG, 'pdel' + Date.now() + Math.random().toString(36).slice(2, 5));
  try {
    const a = FB.authM.getAuth(sec);
    const cred = await FB.authM.signInWithEmailAndPassword(a, email, pw);
    await FB.authM.deleteUser(cred.user);
    return true;
  } catch (e) { return false; }
  finally { try { await FB.appM.deleteApp(sec); } catch (x) { /* تجاهل */ } }
}
async function reissuePair(g) {

// حذف نهائي من الموقع ومن Firebase Authentication
async function deletePairs(list, onProgress) {
  if (!list.length) return;
  const msg = list.length === 1 ? 'حذف حسابات «' + list[0].sname + '» (الطالب وولي الأمر) نهائيًا؟' : 'حذف حسابات ' + list.length + ' طالب (وأولياء أمورهم) نهائيًا؟';
  if (!(await confirmBox(msg + '\nهيتمسحوا من الموقع ومن Firebase Authentication، ومش هيقدروا يدخلوا تاني.', 'حذف'))) return;
  let n = 0, authFail = 0;
  try {
    for (const g of list) {
      n++; if (onProgress) onProgress(n, list.length);
      for (const code of [g.scode, g.pcode]) { if (code && !(await deleteAuthUser(loginId(code), g.pw))) authFail++; }
      for (const u of [g.sUid, g.pUid]) { if (u) { await del('parents/' + u); await del('creds/' + u); } }
      await sleep(250);
    }
    logAudit({ x: 'staff', n: 'حذف حسابات ' + list.length + ' طالب' });
    toast(authFail ? 'اتمسحوا من الموقع. ' + authFail + ' حساب دخول فضلوا في Authentication، امسحهم من Firebase Console.' : 'تم الحذف.', !!authFail);
  } catch (e) { toast(errText(e), true); }
}
function groupPairs(items) {
  const m = new Map();
  items.forEach(c => {
    const g = m.get(c.kid) || { kid: c.kid, sname: c.sname, cname: c.cname, pname: c.pname, pw: c.pw };
    if (c.type === 's') { g.sUid = c.id; g.scode = c.login; } else { g.pUid = c.id; g.pcode = c.login; g.pname = c.pname || g.pname; }
    g.pw = c.pw || g.pw; m.set(c.kid, g);
  });
  return Array.from(m.values()).sort((a, b) => (a.cname || '').localeCompare(b.cname || '', 'ar') || (a.sname || '').localeCompare(b.sname || '', 'ar'));
}
async function syncParentData() {
  if (!(await confirmBox('مزامنة درجات أولياء الأمور من الكشوف الحالية؟\nاعملها مرة بعد التفعيل، ولما ترجّع حاجة من السلة.', 'مزامنة'))) return;
  toast('جارٍ المزامنة…');
  let n = 0;
  try {
    for (const a of allAssignments()) {
      const v = await fetchGrades(a.cid, a.sid);
      for (const st of students(a.cid, true)) {
        const vals = rowNums(v, st.id);
        if (!Object.keys(vals).length) continue;
        await db.doc('pg/' + a.cid + '__' + st.id + '__' + a.sid).set({ k: a.cid + '__' + st.id, cid: a.cid, sid: a.sid, st: st.id, v: vals, t: Date.now() });
        n++;
      }
    }
    const ps = await db.collection('parents').get();
    for (const d of ps.docs) {
      const info = {};
      ((d.data().kids) || []).forEach(k => {
        const parts = k.split('__');

        if (stu) info[k] = { n: stu.name, c: className(parts[0]) };
      });
      if (Object.keys(info).length) await write('parents/' + d.id, { info });

    toast('تمت المزامنة (' + n + ' سجل).');
  } catch (e) { toast(errText(e), true); }
}

    if (!items.length) { out.append(h('div', { class: 'empty', text: 'مفيش حسابات جديدة. تأكد إن الأعمدة: الاسم | الإيميل | كلمة المرور المبدئية | الدور.' })); return; }
    out.append(h('div', { class: 'table-wrap' }, h('table', { class: 'tbl' },
      h('thead', {}, h('tr', {}, h('th', { text: 'الاسم' }), h('th', { text: 'الإيميل' }), h('th', { text: 'الدور' }))),
      h('tbody', {}, items.slice(0, 100).map(x => h('tr', {}, h('td', { text: x.name }), h('td', { dir: 'ltr', style: 'text-align:right', text: x.em }), h('td', { text: ROLES[x.role] })))))));
    out.append(h('div', { class: 'acts', style: 'margin-top:14px' }, h('button', { class: 'btn primary', type: 'button', text: 'إنشاء الحسابات', onclick: run })));
  }
  async function run(e) {
    if (staffBusy) return;
    if (!(await confirmBox('هيتعمل ' + items.length + ' حساب. كلمات المرور هي اللي في الملف، سلّمها لأصحابها.', 'تنفيذ'))) return;
    staffBusy = true; e.target.disabled = true;
    const res = { made: 0, failed: [], stopped: false };
    let n = 0;
    for (const x of items) {
      n++; status.textContent = 'جارٍ الإنشاء… ' + n + ' من ' + items.length;
      try { await fbCreateUser(x.name, x.em, x.pw, x.role); res.made++; }
      catch (err) {
        const c = err && err.code;
        res.failed.push(x.name + ': ' + (c === 'auth/email-already-in-use' ? 'الإيميل موجود في Authentication بس مش في المستخدمون' : (c && c.startsWith('auth/') ? authErr(err) : errText(err))));
        if (c === 'auth/too-many-requests') { res.stopped = true; break; }
      }
      await sleep(400);
    }
    staffBusy = false; staffImportResult = res; items = []; status.textContent = ''; file.value = '';
    out.innerHTML = ''; out.append(resultView(res));
  }
  return h('div', { class: 'card' }, h('h2', { text: 'استيراد معلمين من ملف' }),
    h('p', { class: 'note', text: 'الأعمدة: الاسم | الإيميل | كلمة المرور المبدئية (8 على الأقل) | الدور (معلم / الكنترول / إدارة النظام). أي عمود تاني (زي الفصل) بيتجاهل. الإيميلات الموجودة بتتخطى.' }),
    h('div', { class: 'form-row' }, h('label', { class: 'f' }, 'ملف Excel أو CSV', file), h('button', { class: 'btn primary', type: 'button', text: 'معاينة', onclick: preview })),
    status, out);
}
  
async function fbLogout() { try { await FB.authM.signOut(FB.auth); } catch (e) { /* تجاهل */ } location.reload(); }
function fbAddUserCard() {
  const name = h('input', { type: 'text', id: 'fbName' });
  const email = h('input', { type: 'text', inputmode: 'email', dir: 'ltr', id: 'fbEmail', autocapitalize: 'none' });
  const pw = h('input', { type: 'text', dir: 'ltr', id: 'fbPw', autocomplete: 'off', placeholder: '8 حروف أو أكتر' });
  const roleSel = h('select', { id: 'fbRole' }, Object.entries(ROLES).map(([k, v]) => h('option', { value: k, text: v })));
  const rEmail = h('input', { type: 'text', inputmode: 'email', dir: 'ltr', id: 'fbResetEmail', autocapitalize: 'none' });
  return h('div', {},
    h('div', { class: 'card' }, h('h2', { text: 'إضافة مستخدم' }),
      h('div', { class: 'form-row' },
        h('label', { class: 'f' }, 'الاسم', name), h('label', { class: 'f' }, 'الإيميل', email),
        h('label', { class: 'f' }, 'كلمة مرور مبدئية', pw), h('label', { class: 'f' }, 'الدور', roleSel),
        h('button', { class: 'btn primary', type: 'button', text: 'إنشاء الحساب', onclick: async () => {
          const n = name.value.trim(), em = email.value.trim();
          if (!n || !em) { toast('اكتب الاسم والإيميل.', true); return; }
          if (pw.value.length < 8) { toast('كلمة المرور لازم تكون 8 على الأقل.', true); return; }
          try { await fbCreateUser(n, em, pw.value, roleSel.value); toast('تم إنشاء الحساب. سلّم الإيميل وكلمة المرور للمستخدم.'); name.value = ''; email.value = ''; pw.value = ''; }
          catch (e) { toast(e && e.code && e.code.startsWith('auth/') ? authErr(e) : errText(e), true); }
        } }))),
    h('div', { class: 'card' }, h('h2', { text: 'إعادة تعيين كلمة مرور' }),
      h('p', { class: 'note', text: 'بيتبعت للمستخدم رابط على إيميله يختار منه كلمة مرور جديدة.' }),
      h('div', { class: 'form-row' }, h('label', { class: 'f' }, 'إيميل المستخدم', rEmail),
        h('button', { class: 'btn', type: 'button', text: 'إرسال الرابط', onclick: async () => {
          if (!rEmail.value.trim()) { toast('اكتب الإيميل.', true); return; }
          try { await FB.authM.sendPasswordResetEmail(FB.auth, rEmail.value.trim()); toast('تم إرسال الرابط.'); } catch (e) { toast(authErr(e), true); }
        } }))));
}

async function init() {
  header();
  if (!window.claude || !window.claude.use) {
    const useFb = !!FIREBASE_CONFIG.apiKey;
    try { if (useFb) await setupFirebase(); else await setupLocal(); }
    catch (e) { console.error(e); S.fatal = useFb ? 'تعذّر الاتصال بـ Firebase: ' + ((e && (e.code || e.message)) || 'خطأ غير معروف') : 'تعذّر تشغيل النظام على المتصفح ده (التخزين المحلي غير متاح).'; renderAll(); return; }
  } else {
    try {
      [db, userCap, dlCap] = await Promise.all([window.claude.use('db'), window.claude.use('user'), window.claude.use('downloads')]);
    } catch (e) { db = null; }
  }
  if (!db || !userCap) { S.fatal = 'النظام يعمل فقط لمن عنده حساب مدعو على claude.ai. سجّل الدخول أو اطلب دعوة من إدارة المدرسة.'; renderAll(); return; }
  try {
    S.me = await userCap.me(); S.isOwner = !!S.me.isOwner; S.isEditor = !!S.me.canEdit;
    if (S.me.id) S.names[S.me.id] = { name: S.me.name || '', tried: !!S.me.name };
  } catch (e) { S.me = null; }
    if (S.parentMode) { renderAll(); subscribeParent(); return; }
  renderAll();
  subscribeAll();
}
init();
})();
</script>
